name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest httpx==0.27.0 pydantic==2.6.4
      - run: python -m pytest backend/tests sdk/tests
        env:
          PYTHONPATH: backend:sdk
